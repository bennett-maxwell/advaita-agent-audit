<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal Command Center · FKI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif;background:#F5F5F7;color:#1D1D1F;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:20px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(0,0,0,0.10)}
.logo{width:56px;height:56px;background:#0071E3;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 20px}
h1{font-size:22px;font-weight:700;color:#1D1D1F;text-align:center;letter-spacing:-0.3px}
p.sub{font-size:13px;color:#86868B;text-align:center;margin:6px 0 28px;line-height:1.5}
label{display:block;font-size:12px;font-weight:600;color:#1D1D1F;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
input[type=password]{width:100%;background:#F5F5F7;border:1.5px solid #D2D2D7;border-radius:10px;padding:13px 16px;color:#1D1D1F;font-size:15px;outline:none;transition:border-color .15s}
input[type=password]:focus{border-color:#0071E3;background:#fff;box-shadow:0 0 0 3px rgba(0,113,227,.1)}
input[type=password].error{border-color:#FF3B30;animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.err{color:#FF3B30;font-size:12px;min-height:16px;margin:6px 0 0}
button{width:100%;margin-top:20px;padding:14px;background:#0071E3;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s}
button:hover{background:#0062C4;transform:translateY(-1px)}
button:active{transform:translateY(0)}
.note{font-size:11px;color:#86868B;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">⚖️</div>
  <h1>Legal Command Center</h1>
  <p class="sub">Privileged &amp; Confidential · Attorney Work-Product · FKI</p>
  <label for="pw">Password</label>
  <input type="password" id="pw" placeholder="Enter password" autofocus autocomplete="current-password">
  <div class="err" id="err"></div>
  <button id="go">Unlock</button>
  <div class="note">v4 · 2026-06-01 · franchiseki2024</div>
</div>
<script>
const TARGET='cf14b16da69167a4a52d1b0de630db1b50c8d506868f071392452a9f408e65c7';
const LEGAL_URL='lcc.html';
const SK='fki_legal_auth';
if(sessionStorage.getItem(SK)==='ok')window.location.href=LEGAL_URL;
async function sha256(s){const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function tryUnlock(){
  const pw=document.getElementById('pw').value;
  const h=await sha256(pw);
  if(h===TARGET){sessionStorage.setItem(SK,'ok');setTimeout(()=>{window.location.href=LEGAL_URL},150)}
  else{const i=document.getElementById('pw');i.classList.add('error');document.getElementById('err').textContent='Incorrect password';setTimeout(()=>i.classList.remove('error'),400)}
}
document.getElementById('go').addEventListener('click',tryUnlock);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock()});
</script>
</body>
</html>
