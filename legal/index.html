<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal Command Center · FKI</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0a0a0f; color:#e0e0e6; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
.gate-card { background:#14141f; border:1px solid #3b82f633; border-radius:20px; padding:40px 36px; width:100%; max-width:400px; display:flex; flex-direction:column; align-items:center; gap:20px; }
.icon-wrap { width:64px; height:64px; background:#3b82f61a; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:28px; }
h1 { font-size:22px; font-weight:700; color:#60a5fa; text-align:center; letter-spacing:-0.3px; }
p.sub { font-size:13px; color:#6b7280; text-align:center; line-height:1.5; margin-top:-8px; }
.input-wrap { width:100%; }
input[type="password"] { width:100%; background:#0f0f1a; border:1px solid #3b82f630; border-radius:10px; padding:13px 16px; color:#fff; font-size:14px; outline:none; transition:border-color .15s; }
input[type="password"]:focus { border-color:#3b82f680; box-shadow:0 0 0 3px rgba(59,130,246,0.08); }
input[type="password"].error { border-color:#ef4444; animation:shake 0.3s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
button { width:100%; padding:13px; background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; transition:transform .1s; }
button:hover { transform:translateY(-1px); }
.note { font-size:11px; color:#6b7280; text-align:center; }
.err { color:#ef4444; font-size:12px; height:14px; }
</style></head>
<body>
<div class="gate-card">
  <div class="icon-wrap">🔒</div>
  <h1>FKI Legal Command Center</h1>
  <p class="sub">Privileged · attorney work-product · password required</p>
  <div class="input-wrap">
    <input type="password" id="pw" placeholder="Enter password" autofocus>
  </div>
  <div class="err" id="err"></div>
  <button id="go">Unlock</button>
  <div class="note">v2 · 2026-05-11 · outside-counsel posture</div>
</div>
<script>
// SHA-256 of "legal2026"
const TARGET = '510492406bed549da69fb70bb0f9e79e04883364df150c37f319ea98152a9aa0';
const LEGAL_URL = 'lcc.html';
const SESSION_KEY = 'fki_legal_auth';

if (sessionStorage.getItem(SESSION_KEY) === 'ok') {
  window.location.href = LEGAL_URL;
}

async function sha256(str) {
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function tryUnlock() {
  const pw = document.getElementById('pw').value;
  const hash = await sha256(pw);
  if (hash === TARGET) {
    sessionStorage.setItem(SESSION_KEY, 'ok');
    document.getElementById('err').textContent = '';
    setTimeout(() => { window.location.href = LEGAL_URL; }, 200);
  } else {
    const inp = document.getElementById('pw');
    inp.classList.add('error');
    document.getElementById('err').textContent = 'Incorrect password';
    setTimeout(()=>inp.classList.remove('error'), 400);
  }
}
document.getElementById('go').addEventListener('click', tryUnlock);
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
</script>
</body></html>
